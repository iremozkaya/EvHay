<html>

<head>
    <title> İlan Sayfası</title>
</head>

<body>
    <h3>Bilgileri doldurun</h3>
    <form>
        <table>

            <tr>
                <td>Adınız: </td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Soyadınız: </td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Email: </td>
                <td>
                    <input type="email">
                </td>
            </tr>

            <tr>
                <td>Telefon: </td>
                <td>
                    <input type="number">
                </td>
            </tr>

            <tr>
                <td>Hayvanınızın cinsi:</td>
                <td>
                    <select>
                        <option></option>
                        <option>Kedi</option>
                        <option>Köpek</option>
                        <option>Hamster</option>
                        <option>Balık</option>
                        <option>Maymun</option>
                        <option>Kuş</option>
                    </select>

                </td>
            </tr>
            <tr>
                <td>Neden sahiplendirmek istiyorsunuz?</td>
                <td><textarea></textarea></td>
            </tr>

            <tr>
                <td>Hayvanınızın bir hastalığı var mı?</td>
                <td>
                    <input type="radio" id="evet" name="hastalik">evet
                    <input type="radio" id="hayır" name="hastalik">hayır<br>
                    <textarea>Varsa açıklayınız.</textarea>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="button" value="kaydet">
                </td>
            </tr>
            </tr>
        </table>
    </form>
</body>

</html>
