<html>

<head>
    <title> Form Sayfası</title>
</head>

<body>
    <h3>BAŞVURU FORMU</h3>
    <form>
        <table>

            <tr>
                <td>Adınız: </td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Soyadınız: </td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Email: </td>
                <td>
                    <input type="email">
                </td>
            </tr>

            <tr>
                <td>Telefon: </td>
                <td>
                    <input type="number">
                </td>
            </tr>

            <tr>
                <td>Sahiplenmek istediğiniz hayvan cinsi:</td>
                <td>
                    <select>
                        <option>Kedi</option>
                        <option>Köpek</option>
                        <option>Hamster</option>
                        <option>Balık</option>
                        <option>Maymun</option>
                        <option>Kuş</option>
                    </select>

                </td>
            </tr>



            <tr>
                <td></td>
                <td>
                    <input type="button" value="kaydet">
                </td>
            </tr>
            </tr>
        </table>
    </form>
</body>

</html>
